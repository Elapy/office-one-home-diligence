<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Diligence — Orders (Admin)</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div class="wrap nav"><strong class="logo">🏠 Home Diligence — Orders</strong><nav><a href="index.html">← Back to site</a></nav></div></header>
<main class="wrap"><h1>Stored orders</h1><p class="muted">Orders saved in this browser's localStorage (<code>hd_orders</code>). This is a prototype admin view — a production version needs a real backend, auth, and payment processing.</p>
<button class="btn secondary" onclick="exportJSON()">Export JSON</button> <button class="btn secondary" onclick="if(confirm('Clear all stored orders?')){localStorage.removeItem('hd_orders');render()}">Clear all</button>
<div id="out" style="margin-top:18px"></div></main>
<script>
function render(){const orders=JSON.parse(localStorage.getItem('hd_orders')||'[]');
 if(!orders.length){document.getElementById('out').innerHTML='<p>No orders yet. Place one on the main page first.</p>';return;}
 document.getElementById('out').innerHTML='<table><tr><th>Order ID</th><th>Created</th><th>Customer</th><th>Property</th><th>Items</th><th>Total</th><th>Status</th></tr>'+orders.map(o=>`<tr><td>${o.id}</td><td>${o.createdAt}</td><td>${o.name}<br>${o.email}</td><td>${o.address}<br>Close: ${o.closeDate||'—'}</td><td>${(o.bundle?'Bundle<br>':'')+o.items.map(i=>i.name).join('<br>')}</td><td>$${o.total}</td><td>${o.status}</td></tr>`).join('')+'</table>';}
function exportJSON(){const data=localStorage.getItem('hd_orders')||'[]';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='home-diligence-orders.json';a.click();}
render();
</script></body></html>
